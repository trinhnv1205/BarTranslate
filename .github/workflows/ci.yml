name: CI

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project BarTranslate.xcodeproj
          -scheme "BarTranslate (Debug)"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project BarTranslate.xcodeproj \
            -scheme "BarTranslate (Debug)" \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""
